# PrivToken-ReID — Baseline A: Plain ReID (No VQ, No Privacy)
# Upper-bound utility reference: ResNet50 + BNNeck + CE + Triplet
# Expected: ~93-95% Rank-1 on Market-1501 with standard tricks

# Paths
data_root: "./market1501"
checkpoint_dir: "./checkpoints_baseline_plain"
log_dir: "./logs_baseline_plain"
output_dir: "./outputs_baseline_plain"

# Dataset
dataset: "market1501"
num_classes: 751
img_height: 256
img_width: 128
num_workers: 4

# Model — NO VQ
baseline_mode: "plain"              # plain | vq_only | full
token_dim: 512                      # feature dimension after projection

# Training
batch_size: 64
num_instances: 4
total_epochs: 60
warmup_epochs: 0                    # no warmup needed — no adversarial stage

# Optimizers
lr_main: 0.035
momentum: 0.9
weight_decay: 0.0005
lr_milestones: [30, 50]
lr_gamma: 0.1

# Loss weights
alpha_triplet: 1.0
triplet_margin: 0.3

# Evaluation
eval_every: 5
save_every: 10

# Reproducibility
seed: 42
