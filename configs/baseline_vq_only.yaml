# PrivToken-ReID — Baseline B: VQ-Only (No Privacy Adversarial)
# Isolates utility loss from tokenization alone (no adversarial game)
# Compare against Baseline A to measure VQ bottleneck impact

# Paths
data_root: "./market1501"
checkpoint_dir: "./checkpoints_baseline_vq"
log_dir: "./logs_baseline_vq"
output_dir: "./outputs_baseline_vq"

# Dataset
dataset: "market1501"
num_classes: 751
img_height: 256
img_width: 128
num_workers: 4

# Model — VQ but NO privacy
baseline_mode: "vq_only"
codebook_size: 4096
token_dim: 512
vq_beta: 0.10
token_grid_h: 16
token_grid_w: 8
num_tokens: 128

# Training
batch_size: 64
num_instances: 4
total_epochs: 60
warmup_epochs: 0                    # no warmup — no adversarial stage

# Optimizers
lr_main: 0.035
momentum: 0.9
weight_decay: 0.0005
lr_milestones: [30, 50]
lr_gamma: 0.1

# Loss weights
alpha_triplet: 1.0
triplet_margin: 0.3

# Evaluation
eval_every: 5
save_every: 10

# Reproducibility
seed: 42
