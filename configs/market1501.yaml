# PrivToken-ReID Configuration — Market-1501 (v3)
# All hyperparameters are defined here; nothing is hardcoded in the Python files.

# Paths
data_root: "./market1501"
checkpoint_dir: "./checkpoints_v3"
log_dir: "./logs_v3"
output_dir: "./outputs_v3"

# Dataset
dataset: "market1501"
num_classes: 751                   # training identities
img_height: 256
img_width: 128
num_workers: 0

# Model architecture
codebook_size: 4096                # VQ-VAE codebook entries K (doubled for more expressiveness)
token_dim: 512                     # dimension of each token embedding
vq_beta: 0.10                     # VQ commitment loss weight (reduced from 0.25 to ease pressure on Re-ID)
token_grid_h: 16                   # spatial token grid height (256/16)
token_grid_w: 8                    # spatial token grid width  (128/16)
num_tokens: 128                    # = token_grid_h * token_grid_w

# Training
batch_size: 64                     # 4 images per ID × 16 IDs (PK sampling)
num_instances: 4                   # images per identity per batch (for triplet)
warmup_epochs: 30                  # stage 1: Re-ID only (model peaked at ~30 in v2)
total_epochs: 80                   # longer adversarial stage for better convergence

# Optimizers
lr_main: 0.035                     # SGD lr for tokenizer + reid_head
lr_attacker: 0.0001                # Adam lr for UNet attacker
momentum: 0.9
weight_decay: 0.0005
lr_milestones: [30, 55]            # decay LR at warmup end and mid-adversarial
lr_gamma: 0.1

# Loss weights
alpha_triplet: 1.0                 # triplet loss weight in Re-ID loss
lambda_priv: 0.005                 # privacy adversarial loss weight (halved — privacy already excellent)
triplet_margin: 0.3

# Adversarial training
attacker_inner_steps: 3            # 3 attacker updates per tokenizer step (increased from 1)
attacker_type: "unet"              # training attacker: unet | residual

# Identity adversarial loss (Phase 4)
lambda_id: 0.01                    # identity adversarial loss weight
lr_id_attacker: 0.001              # Adam lr for identity attacker head
use_region_privacy: true           # region-aware reconstruction loss (stronger on head/face)

# Privacy evaluation
eval_privacy: true                 # run full privacy eval suite during testing
eval_attackers:                    # attacker types to evaluate at test time
  - unet
  - residual
  - transformer
  - feature_inversion
  - identity

# Evaluation
eval_every: 5                      # evaluate on test set every N epochs
save_every: 10                     # save checkpoint every N epochs

# Reproducibility
seed: 42
